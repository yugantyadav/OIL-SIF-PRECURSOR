services:
  postgres:
    image: postgres:16-alpine
    container_name: sif-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sif_db}
      POSTGRES_USER: ${POSTGRES_USER:-sif_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sif_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # No schema seed file here on purpose. The schema is created from
      # backend/models.py via Base.metadata.create_all() in the backend
      # lifespan, so models.py stays the single source of truth. (The former
      # database/init.sql had drifted out of sync — missing reports.risk/
      # status/reported_by and uuid ids where the models use String(36) — and
      # caused /api/reports to fail with UndefinedColumn.)
    ports:
      # Host port remapped to 5433: a native PostgreSQL already listens on 5432
      # on this machine. The backend connects over the compose network via the
      # `postgres:5432` service name, so only host-side psql needs this mapping.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sif_user} -d ${POSTGRES_DB:-sif_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sif-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sif_user}:${POSTGRES_PASSWORD:-sif_pass}@postgres:5432/${POSTGRES_DB:-sif_db}
      AI_SERVICE_URL: http://ai:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.venv
      # Uploaded CCTV clips are written to /data/cctv inside the container;
      # mounting ./data keeps them on the host across rebuilds.
      - ./data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build: ./ai
    container_name: sif-ai
    ports:
      - "8001:8001"
    volumes:
      - ./ai:/app
      - /app/__pycache__
      - /app/.venv
      - ./data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    container_name: sif-frontend
    environment:
      VITE_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
