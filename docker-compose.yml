version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sif-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sif_db}
      POSTGRES_USER: ${POSTGRES_USER:-sif_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sif_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sif_user} -d ${POSTGRES_DB:-sif_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sif-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sif_user}:${POSTGRES_PASSWORD:-sif_pass}@postgres:5432/${POSTGRES_DB:-sif_db}
      AI_SERVICE_URL: http://ai:8001
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: sif-ai
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./ai:/app
      - ./data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sif-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data: